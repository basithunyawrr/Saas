<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="EduFlow - Your education, organized.">
    <title>EduFlow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="toast" class="toast"></div>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="brand-mark">E</div>
            <span>Edu<span>Flow</span></span>
        </div>

        <div class="sidebar-section">
            <p class="sidebar-label">MENU</p>

            <button class="nav-item active" data-page="dashboard">
                <span>⌂</span>
                Dashboard
            </button>

            <button class="nav-item" data-page="courses">
                <span>▣</span>
                My Courses
            </button>

            <button class="nav-item" data-page="assignments">
                <span>✓</span>
                Assignments
                <b class="nav-badge">4</b>
            </button>

            <button class="nav-item" data-page="grades">
                <span>▤</span>
                Grades
            </button>

            <button class="nav-item" data-page="calendar">
                <span>□</span>
                Calendar
            </button>

            <button class="nav-item" data-page="messages">
                <span>✉</span>
                Messages
                <b class="nav-badge">3</b>
            </button>
        </div>

        <div class="sidebar-section sidebar-bottom">
            <p class="sidebar-label">ACCOUNT</p>

            <button class="nav-item" data-page="profile">
                <span>◯</span>
                Profile
            </button>

            <button class="nav-item" data-page="settings">
                <span>⚙</span>
                Settings
            </button>
        </div>

        <div class="sidebar-user">
            <div class="avatar small">AB</div>

            <div>
                <strong id="sidebarUserName">Abdul Basit</strong>
                <span>Student</span>
            </div>

            <button id="logoutBtn">↪</button>
        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <button class="mobile-menu" id="mobileMenu">☰</button>

            <div class="topbar-title">
                <div class="breadcrumb">
                    Student Portal /
                    <span id="breadcrumb">Dashboard</span>
                </div>
            </div>

            <div class="topbar-actions">

                <div class="search-box">
                    <span>⌕</span>

                    <input
                        id="globalSearch"
                        type="search"
                        placeholder="Search anything...">

                    <kbd>Ctrl K</kbd>
                </div>

                <button
                    class="icon-button notification-button"
                    id="notificationBtn">
                    ♧
                    <i></i>
                </button>

                <button
                    class="profile-button"
                    data-page="profile">

                    <div class="avatar">AB</div>

                    <div class="profile-button-text">
                        <strong id="topUserName">Abdul Basit</strong>
                        <span>Student</span>
                    </div>

                    <span>⌄</span>

                </button>

            </div>

        </header>

        <div id="pageContent"></div>

    </main>

</div>

<div
    class="mobile-overlay"
    id="mobileOverlay">
</div>

<div
    class="modal-overlay"
    id="modalOverlay">

    <div class="modal">

        <button
            class="modal-close"
            id="modalClose">
            ×
        </button>

        <div id="modalContent"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
